<meta charset="UTF-8">

<style>

<body>

<header>
  <div class="logo-icon">∫</div>
  <h1>CalcGraph</h1>
  <span>Calculator &amp; Equation Grapher</span>
</header>

<div class="tabs">
  <button class="tab active" onclick="switchTab('calc')">🔢 Calculator</button>
  <button class="tab" onclick="switchTab('graph')">📈 Grapher</button>
</div>

<div class="main">

  <!-- CALCULATOR -->
  <div class="calc-panel visible" id="calc-panel">
    <div class="calc-inner">
      <div class="calc-left">
        <div class="display">
          <div class="expr" id="calcExpr"></div>
          <div class="result" id="calcResult">0</div>
        </div>
        <div class="btn-grid">
          <button class="btn btn-mem"  onclick="memStore()">MS</button>
          <button class="btn btn-mem"  onclick="memRecall()">MR</button>
          <button class="btn btn-mem"  onclick="memClear()">MC</button>
          <button class="btn btn-mem"  onclick="memAdd()">M+</button>
          <button class="btn btn-del"  onclick="delChar()">⌫</button>

          <button class="btn btn-fn" onclick="appendFn('sin(')">sin</button>
          <button class="btn btn-fn" onclick="appendFn('cos(')">cos</button>
          <button class="btn btn-fn" onclick="appendFn('tan(')">tan</button>
          <button class="btn btn-fn" onclick="appendFn('log(')">log</button>
          <button class="btn btn-fn" onclick="appendFn('log(')">ln</button>

          <button class="btn btn-fn" onclick="appendFn('sqrt(')">√</button>
          <button class="btn btn-fn" onclick="appendFn('abs(')">|x|</button>
          <button class="btn btn-op" onclick="append('^')">xⁿ</button>
          <button class="btn btn-op" onclick="append('(')">  (  </button>
          <button class="btn btn-op" onclick="append(')')">  )  </button>

          <button class="btn btn-fn" onclick="appendConst('pi')">π</button>
          <button class="btn btn-fn" onclick="appendConst('e')">e</button>
          <button class="btn btn-fn" onclick="append('!')">n!</button>
          <button class="btn btn-fn" onclick="appendFn('floor(')">⌊x⌋</button>
          <button class="btn btn-fn" onclick="appendFn('ceil(')">⌈x⌉</button>

          <button class="btn btn-num" onclick="append('7')">7</button>
          <button class="btn btn-num" onclick="append('8')">8</button>
          <button class="btn btn-num" onclick="append('9')">9</button>
          <button class="btn btn-op"  onclick="append('/')">÷</button>
          <button class="btn btn-op"  onclick="append('%')">%</button>

          <button class="btn btn-num" onclick="append('4')">4</button>
          <button class="btn btn-num" onclick="append('5')">5</button>
          <button class="btn btn-num" onclick="append('6')">6</button>
          <button class="btn btn-op"  onclick="append('*')">×</button>
          <button class="btn btn-clear" onclick="clearAll()">C</button>

          <button class="btn btn-num" onclick="append('1')">1</button>
          <button class="btn btn-num" onclick="append('2')">2</button>
          <button class="btn btn-num" onclick="append('3')">3</button>
          <button class="btn btn-op"  onclick="append('-')">−</button>
          <button class="btn btn-fn"  onclick="toggleSign()">±</button>

          <button class="btn btn-num btn-zero" onclick="append('0')">0</button>
          <button class="btn btn-num" onclick="append('.')">.</button>
          <button class="btn btn-op"  onclick="append('+')">+</button>
          <button class="btn btn-eq"  onclick="evaluate()">=</button>
        </div>
        <div class="mem-row">
          <span>Memory:</span>
          <div class="mem-val" id="memDisplay">—</div>
        </div>
      </div>
      <div class="calc-right">
        <div class="history-box">
          <h3>History</h3>
          <div id="historyList">
            <div class="history-empty">Your calculations will appear here</div>
          </div>
        </div>
        <button class="clear-hist" onclick="clearHistory()">Clear History</button>
      </div>
    </div>
  </div>

  <!-- GRAPHER -->
  <div class="graph-panel" id="graph-panel">
    <div class="graph-layout">
      <div class="graph-sidebar">
        <div class="equation-list" id="equationList"></div>
        <button class="add-eq-btn" onclick="addEquation()">+ Add equation</button>

        <!-- VARIABLES -->
        <div class="vars-section">
          <div class="vars-header" onclick="toggleVarsPanel()">
            <div class="vars-header-left">
              <span>Variables</span>
              <span class="vars-badge" id="varsBadge">0</span>
            </div>
            <span class="vars-toggle" id="varsToggle">▼</span>
          </div>
          <div class="vars-body" id="varsBody">
            <div class="vars-hint">
              Define constants like <code>a</code>, <code>k</code>, <code>n</code> and use them in any equation.<br>
              Values can be numbers or expressions like <code>pi/2</code>.
            </div>
            <div id="varList"></div>
            <button class="add-var-btn" onclick="addVariable()">+ Add variable</button>
          </div>
        </div>

        <div class="graph-controls">
          <div class="ctrl-row">
            <div class="ctrl-group"><label>X min</label><input type="number" id="xMin" value="-10"></div>
            <div class="ctrl-group"><label>X max</label><input type="number" id="xMax" value="10"></div>
          </div>
          <div class="ctrl-row">
            <div class="ctrl-group"><label>Y min</label><input type="number" id="yMin" value="-10"></div>
            <div class="ctrl-group"><label>Y max</label><input type="number" id="yMax" value="10"></div>
          </div>
          <div class="ctrl-row">
            <div class="ctrl-group"><label>Grid step</label><input type="number" id="gridStep" value="1" min="0.1" step="0.1"></div>
            <div class="ctrl-group"><label>Resolution</label><input type="number" id="resolution" value="800" min="100" max="2000" step="100"></div>
          </div>
          <button class="plot-btn" onclick="plotAll()">Plot Graph</button>
        </div>
        <div class="graph-error" id="graphError"></div>
      </div>

      <div class="graph-canvas-wrap" id="canvasWrap">
        <canvas id="graphCanvas"></canvas>
        <div class="graph-info">
          <div class="info-pill">x: <span id="hoverX">—</span></div>
          <div class="info-pill">y: <span id="hoverY">—</span></div>
          <div class="info-pill">Scroll to zoom · Drag to pan</div>
        </div>
      </div>
    </div>
  </div>
</div>

<script>
/* ════════════════════════════════════════
   CALCULATOR
════════════════════════════════════════ */
let expression = '';
let memory = null;
let history = [];
let justEvaluated = false;

const exprEl    = document.getElementById('calcExpr');
const resultEl  = document.getElementById('calcResult');
const memEl     = document.getElementById('memDisplay');

function updateDisplay(val, isError = false) {
  resultEl.textContent = val;
  resultEl.className = 'result' + (isError ? ' error' : '');
}

function render() {
  exprEl.textContent = expression || '';
  if (!expression) { updateDisplay('0'); return; }
  try {
    const val = math.evaluate(sanitize(expression));
    const fmt = typeof val === 'number' ? +val.toPrecision(12) : val;
    updateDisplay(String(fmt));
  } catch { updateDisplay('...'); }
}

function sanitize(expr) {
  return expr
    .replace(/÷/g, '/')
    .replace(/×/g, '*')
    .replace(/−/g, '-')
    .replace(/π/g, 'pi');
}

function append(ch) {
  if (justEvaluated && /[\d.]/.test(ch))       { expression = ''; }
  if (justEvaluated && /[+\-*\/^%]/.test(ch))  { expression = resultEl.textContent || ''; }
  justEvaluated = false;
  expression += ch;
  render();
}

function appendFn(fn) { justEvaluated = false; expression += fn; render(); }

function appendConst(c) {
  justEvaluated = false;
  expression += (c === 'pi') ? 'π' : 'e';
  render();
}

function delChar() { justEvaluated = false; expression = expression.slice(0, -1); render(); }

function clearAll() { expression = ''; justEvaluated = false; updateDisplay('0'); exprEl.textContent = ''; }

function toggleSign() {
  if (expression.startsWith('-')) expression = expression.slice(1);
  else expression = '-' + expression;
  render();
}

function evaluate() {
  if (!expression) return;
  try {
    const val = math.evaluate(sanitize(expression));
    const fmt = typeof val === 'number' ? +val.toPrecision(12) : val;
    addHistory(expression, String(fmt));
    exprEl.textContent = expression + ' =';
    expression = String(fmt);
    updateDisplay(String(fmt));
    justEvaluated = true;
  } catch (e) {
    updateDisplay('Error: ' + (e.message || 'Invalid'), true);
    justEvaluated = true;
  }
}

function addHistory(expr, res) {
  history.unshift({ expr, res });
  if (history.length > 50) history.pop();
  renderHistory();
}

function renderHistory() {
  const el = document.getElementById('historyList');
  if (!history.length) { el.innerHTML = '<div class="history-empty">Your calculations will appear here</div>'; return; }
  el.innerHTML = history.map((h, i) => `
    <div class="history-item" onclick="loadHistory(${i})">
      <div class="hi-expr">${h.expr}</div>
      <div class="hi-result">${h.res}</div>
    </div>`).join('');
}

function loadHistory(i) { expression = history[i].res; justEvaluated = false; render(); }
function clearHistory() { history = []; renderHistory(); }

function memStore()  { try { memory = math.evaluate(sanitize(expression)); memEl.textContent = +memory.toPrecision(6); } catch {} }
function memRecall() { if (memory !== null) { expression += memory; render(); } }
function memClear()  { memory = null; memEl.textContent = '—'; }
function memAdd()    { try { memory = (memory || 0) + math.evaluate(sanitize(expression)); memEl.textContent = +memory.toPrecision(6); } catch {} }

document.addEventListener('keydown', e => {
  if (!document.getElementById('calc-panel').classList.contains('visible')) return;
  if (document.activeElement && document.activeElement.tagName === 'INPUT') return;
  if (e.key === 'Enter')     { evaluate(); return; }
  if (e.key === 'Backspace') { delChar();  return; }
  if (e.key === 'Escape')    { clearAll(); return; }
  if (/^[\d.+\-*\/()\^%]$/.test(e.key)) { append(e.key); }
});

/* ════════════════════════════════════════
   GRAPHER
════════════════════════════════════════ */
const COLORS = ['#4f8ef7','#3ecf8e','#f7c35e','#f75e5e','#c47ef7','#f7895e'];
let equations = [];
let eqCount   = 0;

/* ── Variables ── */
let variables  = [];   // [{ name, expr }]
let varCount   = 0;
let varsOpen   = true;

function toggleVarsPanel() {
  varsOpen = !varsOpen;
  document.getElementById('varsBody').classList.toggle('hidden', !varsOpen);
  document.getElementById('varsToggle').classList.toggle('open', varsOpen);
}

function addVariable(name = '', expr = '') {
  const id = varCount++;
  variables.push({ id, name, expr });
  renderVarList();
}

function removeVariable(id) {
  variables = variables.filter(v => v.id !== id);
  renderVarList();
  redraw();
}

function renderVarList() {
  const el = document.getElementById('varList');
  el.innerHTML = variables.map((v, i) => `
    <div class="var-row" id="varrow-${v.id}">
      <input class="var-name-input" type="text"
        value="${escHtml(v.name)}"
        placeholder="a"
        maxlength="12"
        oninput="variables[${i}].name = this.value.trim(); updateVarBadge();"
        onkeydown="if(event.key==='Enter') plotAll()">
      <span class="var-eq-sign">=</span>
      <input class="var-val-input" type="text" id="varval-${v.id}"
        value="${escHtml(v.expr)}"
        placeholder="e.g. 2, pi/4"
        oninput="variables[${i}].expr = this.value; validateVar(${i}); "
        onkeydown="if(event.key==='Enter') plotAll()">
      <button class="var-remove" onclick="removeVariable(${v.id})">×</button>
    </div>`).join('');
  updateVarBadge();
}

function validateVar(i) {
  const v = variables[i];
  const input = document.getElementById('varval-' + v.id);
  if (!input) return;
  try {
    if (v.expr.trim()) math.evaluate(v.expr);
    input.classList.remove('invalid');
  } catch {
    input.classList.add('invalid');
  }
}

function updateVarBadge() {
  const valid = variables.filter(v => v.name && v.expr).length;
  document.getElementById('varsBadge').textContent = valid;
}

function escHtml(s) { return s.replace(/&/g,'&amp;').replace(/"/g,'&quot;').replace(/</g,'&lt;'); }

/* Build the scope object: resolve variables in definition order,
   allowing later vars to reference earlier ones (e.g. b = 2*a). */
function buildScope(x) {
  const scope = { x, pi: Math.PI, e: Math.E };
  for (const v of variables) {
    if (!v.name || !v.expr.trim()) continue;
    // skip reserved
    if (v.name === 'x' || v.name === 'pi' || v.name === 'e') continue;
    try { scope[v.name] = math.evaluate(v.expr, scope); }
    catch { /* skip bad var */ }
  }
  return scope;
}

/* View state — updated by zoom/pan */
let vXMin = -10, vXMax = 10, vYMin = -10, vYMax = 10;

/* Pan state */
let isDragging   = false;
let dragStartPx  = null;   // canvas pixel coords where drag began
let dragViewSnap = null;   // view snapshot at drag start

const canvas = document.getElementById('graphCanvas');
const ctx    = canvas.getContext('2d');

/* ── Resize: set canvas pixel size to match CSS size ── */
function resizeCanvas() {
  const wrap = document.getElementById('canvasWrap');
  const w = wrap.clientWidth;
  const h = Math.min(500, Math.max(320, Math.round(w * 0.58)));
  if (canvas.width !== w || canvas.height !== h) {
    canvas.width  = w;
    canvas.height = h;
  }
}

/* ── Coordinate transforms ── */
function worldToCanvas(wx, wy) {
  const cw = canvas.width, ch = canvas.height;
  const px = (wx - vXMin) / (vXMax - vXMin) * cw;
  const py = ch - (wy - vYMin) / (vYMax - vYMin) * ch;
  return [px, py];
}

function canvasToWorld(px, py) {
  const cw = canvas.width, ch = canvas.height;
  const wx = px / cw * (vXMax - vXMin) + vXMin;
  const wy = (ch - py) / ch * (vYMax - vYMin) + vYMin;
  return [wx, wy];
}

/* ── Draw grid + axes + labels ── */
function drawGrid() {
  const cw = canvas.width, ch = canvas.height;
  const step = Math.max(parseFloat(document.getElementById('gridStep').value) || 1, 1e-9);

  ctx.clearRect(0, 0, cw, ch);
  ctx.fillStyle = '#14171f';
  ctx.fillRect(0, 0, cw, ch);

  /* grid lines */
  ctx.strokeStyle = '#1e2333';
  ctx.lineWidth = 1;
  const xStart = Math.ceil(vXMin / step) * step;
  for (let x = xStart; x <= vXMax + 1e-9; x += step) {
    const [px] = worldToCanvas(x, 0);
    ctx.beginPath(); ctx.moveTo(px, 0); ctx.lineTo(px, ch); ctx.stroke();
  }
  const yStart = Math.ceil(vYMin / step) * step;
  for (let y = yStart; y <= vYMax + 1e-9; y += step) {
    const [, py] = worldToCanvas(0, y);
    ctx.beginPath(); ctx.moveTo(0, py); ctx.lineTo(cw, py); ctx.stroke();
  }

  /* axes */
  ctx.strokeStyle = '#4a5568';
  ctx.lineWidth = 1.5;
  const [axX] = worldToCanvas(0, 0);
  const [, axY] = worldToCanvas(0, 0);
  ctx.beginPath(); ctx.moveTo(axX, 0); ctx.lineTo(axX, ch); ctx.stroke();
  ctx.beginPath(); ctx.moveTo(0, axY); ctx.lineTo(cw, axY); ctx.stroke();

  /* axis labels */
  ctx.font = '11px Inter, system-ui, sans-serif';
  ctx.fillStyle = '#4b5568';

  ctx.textAlign = 'center';
  for (let x = xStart; x <= vXMax + 1e-9; x += step) {
    if (Math.abs(x) < step * 0.01) continue;
    const [px] = worldToCanvas(x, 0);
    const labelY = Math.min(axY + 16, ch - 4);
    ctx.fillText(+x.toPrecision(4), px, labelY);
  }
  ctx.textAlign = 'right';
  for (let y = yStart; y <= vYMax + 1e-9; y += step) {
    if (Math.abs(y) < step * 0.01) continue;
    const [, py] = worldToCanvas(0, y);
    const labelX = Math.min(axX - 4, cw - 4);
    ctx.fillText(+y.toPrecision(4), labelX, py + 4);
  }

  /* origin */
  const [ox, oy] = worldToCanvas(0, 0);
  ctx.fillStyle = '#4b5568';
  ctx.textAlign = 'right';
  ctx.fillText('0', ox - 4, oy + 14);
}

/* ── Evaluate a compiled expression safely ── */
function evalAt(compiled, x) {
  try {
    const scope = buildScope(x);
    const v = compiled.evaluate(scope);
    return (typeof v === 'number' && isFinite(v)) ? v : null;
  } catch { return null; }
}

/* ── Plot all equations on top of the grid ── */
function plotAll() {
  /* Sync view from inputs (only when user clicks Plot, not during pan/zoom) */
  syncViewFromInputs();

  /* Resize without clearing yet — resizeCanvas only changes width/height attrs */
  resizeCanvas();

  drawGrid();

  const errEl  = document.getElementById('graphError');
  errEl.className = 'graph-error';
  const errors = [];
  const steps  = Math.max(100, parseInt(document.getElementById('resolution').value) || 800);
  const yRange = vYMax - vYMin;

  equations.forEach(eq => {
    const formula = eq.formula.trim();
    if (!formula) return;

    let compiled;
    try { compiled = math.compile(formula); }
    catch { errors.push('"' + formula + '" — syntax error'); return; }

    /* Test that it can actually evaluate */
    try { compiled.evaluate(buildScope(0)); }
    catch { errors.push('"' + formula + '" — could not evaluate'); return; }

    ctx.save();
    ctx.beginPath();
    ctx.strokeStyle = eq.color;
    ctx.lineWidth   = 2.2;
    ctx.lineJoin    = 'round';
    ctx.lineCap     = 'round';

    let penDown = false;
    let prevY   = null;

    for (let i = 0; i <= steps; i++) {
      const x  = vXMin + (vXMax - vXMin) * (i / steps);
      const y  = evalAt(compiled, x);

      if (y === null) { penDown = false; prevY = null; continue; }

      /* Detect discontinuity (e.g. tan asymptotes) */
      if (prevY !== null && Math.abs(y - prevY) > yRange * 3) {
        penDown = false;
      }

      const [px, py] = worldToCanvas(x, y);

      if (!penDown) { ctx.moveTo(px, py); penDown = true; }
      else           { ctx.lineTo(px, py); }

      prevY = y;
    }

    ctx.stroke();
    ctx.restore();
  });

  /* Legend */
  let li = 0;
  equations.forEach(eq => {
    if (!eq.formula.trim()) return;
    const lx = 14, ly = 14 + li * 26;
    ctx.fillStyle = eq.color;
    ctx.fillRect(lx, ly, 22, 3);
    ctx.fillStyle = '#e8eaf0';
    ctx.font = '12px Inter, system-ui, sans-serif';
    ctx.textAlign = 'left';
    ctx.fillText('y = ' + eq.formula, lx + 28, ly + 5);
    li++;
  });

  if (errors.length) {
    errEl.textContent = errors.join(' | ');
    errEl.className = 'graph-error show';
  }
}

/* ── Internal redraw during pan/zoom (no input sync) ── */
function redraw() {
  resizeCanvas();
  drawGrid();

  const steps  = Math.max(100, parseInt(document.getElementById('resolution').value) || 800);
  const yRange = vYMax - vYMin;

  equations.forEach(eq => {
    const formula = eq.formula.trim();
    if (!formula) return;
    let compiled;
    try { compiled = math.compile(formula); }
    catch { return; }

    ctx.save();
    ctx.beginPath();
    ctx.strokeStyle = eq.color;
    ctx.lineWidth   = 2.2;
    ctx.lineJoin    = 'round';
    ctx.lineCap     = 'round';

    let penDown = false, prevY = null;
    for (let i = 0; i <= steps; i++) {
      const x = vXMin + (vXMax - vXMin) * (i / steps);
      const y = evalAt(compiled, x);
      if (y === null) { penDown = false; prevY = null; continue; }
      if (prevY !== null && Math.abs(y - prevY) > yRange * 3) penDown = false;
      const [px, py] = worldToCanvas(x, y);
      if (!penDown) { ctx.moveTo(px, py); penDown = true; }
      else ctx.lineTo(px, py);
      prevY = y;
    }
    ctx.stroke();
    ctx.restore();
  });

  /* Legend */
  let li = 0;
  equations.forEach(eq => {
    if (!eq.formula.trim()) return;
    const lx = 14, ly = 14 + li * 26;
    ctx.fillStyle = eq.color;
    ctx.fillRect(lx, ly, 22, 3);
    ctx.fillStyle = '#e8eaf0';
    ctx.font = '12px Inter, system-ui, sans-serif';
    ctx.textAlign = 'left';
    ctx.fillText('y = ' + eq.formula, lx + 28, ly + 5);
    li++;
  });
}

function syncViewFromInputs() {
  const xMin = parseFloat(document.getElementById('xMin').value);
  const xMax = parseFloat(document.getElementById('xMax').value);
  const yMin = parseFloat(document.getElementById('yMin').value);
  const yMax = parseFloat(document.getElementById('yMax').value);
  if (isFinite(xMin) && isFinite(xMax) && xMin < xMax) { vXMin = xMin; vXMax = xMax; }
  if (isFinite(yMin) && isFinite(yMax) && yMin < yMax) { vYMin = yMin; vYMax = yMax; }
}

function syncInputsFromView() {
  document.getElementById('xMin').value = +vXMin.toPrecision(6);
  document.getElementById('xMax').value = +vXMax.toPrecision(6);
  document.getElementById('yMin').value = +vYMin.toPrecision(6);
  document.getElementById('yMax').value = +vYMax.toPrecision(6);
}

/* ── Equation management ── */
function addEquation(formula = '') {
  const color = COLORS[eqCount % COLORS.length];
  const id    = eqCount++;
  equations.push({ id, formula, color });
  renderEquationList();
}

function renderEquationList() {
  const el = document.getElementById('equationList');
  el.innerHTML = equations.map((eq, i) => `
    <div class="eq-row">
      <div class="eq-color-dot" style="background:${eq.color}"></div>
      <span class="eq-label">y =</span>
      <input class="eq-input" type="text" value="${eq.formula.replace(/"/g,'&quot;')}"
        placeholder="e.g. sin(x), x^2, 1/x"
        oninput="equations[${i}].formula = this.value"
        onkeydown="if(event.key==='Enter') plotAll()">
      <button class="eq-remove" onclick="removeEquation(${i})">×</button>
    </div>`).join('');
}

function removeEquation(i) {
  equations.splice(i, 1);
  renderEquationList();
  redraw();
}

/* ── Scroll to zoom ── */
canvas.addEventListener('wheel', e => {
  e.preventDefault();
  const rect   = canvas.getBoundingClientRect();
  const scaleX = canvas.width  / rect.width;
  const scaleY = canvas.height / rect.height;
  const cpx    = (e.clientX - rect.left) * scaleX;
  const cpy    = (e.clientY - rect.top)  * scaleY;
  const [mx, my] = canvasToWorld(cpx, cpy);

  const factor = e.deltaY > 0 ? 1.12 : 0.89;
  vXMin = mx + (vXMin - mx) * factor;
  vXMax = mx + (vXMax - mx) * factor;
  vYMin = my + (vYMin - my) * factor;
  vYMax = my + (vYMax - my) * factor;

  syncInputsFromView();
  redraw();
}, { passive: false });

/* ── Mouse drag to pan ── */
canvas.addEventListener('mousedown', e => {
  isDragging   = true;
  const rect   = canvas.getBoundingClientRect();
  const scaleX = canvas.width  / rect.width;
  const scaleY = canvas.height / rect.height;
  dragStartPx  = [
    (e.clientX - rect.left) * scaleX,
    (e.clientY - rect.top)  * scaleY
  ];
  dragViewSnap = { xMin: vXMin, xMax: vXMax, yMin: vYMin, yMax: vYMax };
  canvas.style.cursor = 'grabbing';
});

window.addEventListener('mousemove', e => {
  /* Hover coords (always) */
  const rect   = canvas.getBoundingClientRect();
  if (e.clientX >= rect.left && e.clientX <= rect.right &&
      e.clientY >= rect.top  && e.clientY <= rect.bottom) {
    const scaleX = canvas.width  / rect.width;
    const scaleY = canvas.height / rect.height;
    const cpx = (e.clientX - rect.left) * scaleX;
    const cpy = (e.clientY - rect.top)  * scaleY;
    const [wx, wy] = canvasToWorld(cpx, cpy);
    document.getElementById('hoverX').textContent = +wx.toPrecision(5);
    document.getElementById('hoverY').textContent = +wy.toPrecision(5);
  }

  if (!isDragging || !dragStartPx) return;
  const scaleX = canvas.width  / rect.width;
  const scaleY = canvas.height / rect.height;
  const curPx  = [
    (e.clientX - rect.left) * scaleX,
    (e.clientY - rect.top)  * scaleY
  ];

  /* Delta in world units computed from the SNAPSHOT, not the moving view */
  const xRange = dragViewSnap.xMax - dragViewSnap.xMin;
  const yRange = dragViewSnap.yMax - dragViewSnap.yMin;
  const dx = (dragStartPx[0] - curPx[0]) / canvas.width  * xRange;
  const dy = (curPx[1] - dragStartPx[1]) / canvas.height * yRange;

  vXMin = dragViewSnap.xMin + dx;
  vXMax = dragViewSnap.xMax + dx;
  vYMin = dragViewSnap.yMin + dy;
  vYMax = dragViewSnap.yMax + dy;

  syncInputsFromView();
  redraw();
});

window.addEventListener('mouseup', () => {
  isDragging = false;
  canvas.style.cursor = 'crosshair';
});

/* ── Touch pan ── */
let lastTouchPx = null;
canvas.addEventListener('touchstart', e => {
  if (e.touches.length === 1) {
    const rect = canvas.getBoundingClientRect();
    lastTouchPx = [e.touches[0].clientX - rect.left, e.touches[0].clientY - rect.top];
    dragViewSnap = { xMin: vXMin, xMax: vXMax, yMin: vYMin, yMax: vYMax };
  }
}, { passive: true });

canvas.addEventListener('touchmove', e => {
  if (e.touches.length !== 1 || !lastTouchPx) return;
  e.preventDefault();
  const rect = canvas.getBoundingClientRect();
  const curPx = [e.touches[0].clientX - rect.left, e.touches[0].clientY - rect.top];
  const scaleX = canvas.width / rect.width;
  const scaleY = canvas.height / rect.height;

  const xRange = vXMax - vXMin;
  const yRange = vYMax - vYMin;
  const dx = (lastTouchPx[0] - curPx[0]) * scaleX / canvas.width  * xRange;
  const dy = (curPx[1] - lastTouchPx[1]) * scaleY / canvas.height * yRange;

  vXMin += dx; vXMax += dx;
  vYMin += dy; vYMax += dy;

  lastTouchPx = curPx;
  syncInputsFromView();
  redraw();
}, { passive: false });

/* ════════════════════════════════════════
   TAB SWITCHING
════════════════════════════════════════ */
function switchTab(tab) {
  document.querySelectorAll('.tab').forEach((t, i) => {
    t.classList.toggle('active', (i === 0 && tab === 'calc') || (i === 1 && tab === 'graph'));
  });
  document.getElementById('calc-panel').classList.toggle('visible', tab === 'calc');
  document.getElementById('graph-panel').classList.toggle('visible', tab === 'graph');
  if (tab === 'graph') {
    requestAnimationFrame(() => { resizeCanvas(); plotAll(); });
  }
}

window.addEventListener('resize', () => {
  if (document.getElementById('graph-panel').classList.contains('visible')) {
    resizeCanvas(); redraw();
  }
});

/* ════════════════════════════════════════
   INIT
════════════════════════════════════════ */
addEquation('a * sin(k * x)');
addEquation('x ^ 2 / n');
addVariable('a', '1');
addVariable('k', '1');
addVariable('n', '4');

resizeCanvas();
/* Graph panel is hidden at load — canvas will be drawn when user clicks the tab */
</script>
</body>
</html>
